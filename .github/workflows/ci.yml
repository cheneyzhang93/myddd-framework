name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建与测试
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: devbox 镜像 tag ↔ 父 POM 属性一致性（无需 Docker，先于构建判红）
        run: bash myddd-devbox/verify-images.sh
      - name: devbox compose 卫生检查（明文凭据/野变量/写死端口/悬空依赖，无需 Docker）
        run: bash myddd-devbox/check-compose.sh
      - name: Build and verify
        run: ./mvnw -B -ntp clean install
      - name: 断言覆盖率产物存在（防"无测试数据即跳过门槛"）
        run: |
          set -euo pipefail
          missing=0
          while IFS= read -r pom; do
            grep -q '<packaging>pom</packaging>' "$pom" && continue
            module_dir="$(dirname "$pom")"
            if ! grep -q 'jacoco-maven-plugin' "$pom"; then
              echo "::error::模块 $module_dir 为 jar 打包但未激活 JaCoCo（父 POM 只在 pluginManagement 中声明，模块须在 <build><plugins> 中显式激活），覆盖率门槛会静默失效"
              missing=1
              continue
            fi
            if [ ! -s "$module_dir/target/site/jacoco/jacoco.csv" ]; then
              echo "::error::模块 $module_dir 声明了 JaCoCo 却未产出覆盖率数据（测试缺失或未执行）"
              missing=1
            fi
          # tools/ 下是非 reactor 的消费端夹具（bom-smoke / no-springdoc-smoke），它们刻意不激活 JaCoCo：
          # 夹具自己没有覆盖率门槛，逼它激活反而会把"夹具即模块"的边界糊掉。这里只放过 tools/，
          # reactor 里新增 jar 模块忘了激活 JaCoCo 仍然立刻红。
          done < <(find . -name pom.xml -not -path '*/target/*' -not -path './tools/*')
          exit $missing
      - name: 集成测试真实执行断言（防"CI 上 IT 被静默跳过"）
        run: |
          set -euo pipefail
          # 本机无 Docker 时 IT 整类跳过是设计内的行为（devbox/README 有补跑清单），但 CI runner 有 Docker：
          # 这里若统计到"一条 IT 都没跑"或"跑了的里面有跳过"，就是环境或注解出错，必须判红而不是绿着过去。
          total=0
          skipped=0
          files=0
          while IFS= read -r xml; do
            files=$((files + 1))
            t=$(sed -n 's/.*<testsuite[^>]* tests="\([0-9]*\)".*/\1/p' "$xml" | head -1)
            s=$(sed -n 's/.*<testsuite[^>]* skipped="\([0-9]*\)".*/\1/p' "$xml" | head -1)
            total=$((total + ${t:-0}))
            skipped=$((skipped + ${s:-0}))
          done < <(find . -path '*/target/failsafe-reports/TEST-*.xml' | sort)
          echo "failsafe 报告 $files 份，IT 用例 $total 条，跳过 $skipped 条"
          [ "$files" -gt 0 ] || { echo "::error::没有任何 failsafe 报告：IT 要么未编写、要么 verify 阶段被绕过"; exit 1; }
          [ "$total" -gt 0 ] || { echo "::error::failsafe 报告里一条用例都没有（IT 空转）"; exit 1; }
          [ "$skipped" -eq 0 ] || { echo "::error::有 $skipped 条 IT 被跳过——CI 有 Docker，跳过即容器/Testcontainers 侧出了问题"; exit 1; }
      - name: 覆盖率门槛值守卫（防模块阈值静默回落到父级 0.60）
        run: |
          python3 - <<'PY'
          import pathlib, sys
          import xml.etree.ElementTree as ET

          NS = "{http://maven.apache.org/POM/4.0.0}"
          JACOCO = "jacoco-maven-plugin"
          FLOOR_KERNEL, FLOOR_DEFAULT = 0.80, 0.60
          errors = []

          def name(e):
              return e.tag[len(NS):] if e.tag.startswith(NS) else e.tag

          def text(e):
              return (e.text or "").strip()

          def kids(e, tag):
              return [c for c in e if name(c) == tag]

          def allof(e, tag):
              return [c for c in e.iter() if name(c) == tag]

          def artifact_id(root):
              for c in root:
                  if name(c) == "artifactId":
                      return text(c)
              return ""

          def as_ratio(where, raw):
              try:
                  return float(raw)
              except ValueError:
                  errors.append(f"{where}：阈值 {raw!r} 不是数字")
                  return None

          poms = sorted(p for p in pathlib.Path(".").rglob("pom.xml") if "target" not in p.parts)
          if not poms:
              print("::error::未发现任何 pom.xml（守卫扫描范围失效）")
              sys.exit(1)
          for p in poms:
              raw = p.read_text(encoding="utf-8")
              if "<!DOCTYPE" in raw or "<!ENTITY" in raw:
                  print(f"::error::{p} 含 DOCTYPE/ENTITY 声明：拒绝解析（防实体膨胀/外部实体）")
                  sys.exit(1)
          roots = {p: ET.parse(p).getroot() for p in poms}

          # 1) 内核模块：按 artifactId 前缀识别（不依赖目录位置），六个家族成员必须齐全
          REQUIRED_KERNEL = {"myddd-kernel-common", "myddd-kernel-ddd", "myddd-kernel-port",
                             "myddd-kernel-extension", "myddd-kernel-statemachine", "myddd-kernel-rule"}
          kernel = {p: (artifact_id(r), r) for p, r in roots.items()
                    if artifact_id(r).startswith("myddd-kernel-") or "myddd-kernel" in p.parts}
          missing = sorted(REQUIRED_KERNEL - {aid for _, (aid, _) in kernel.items()})
          if missing:
              errors.append(f"缺少内核模块 {missing}：扫描范围失效（模块被删除或改名），内核门槛覆盖不全")

          # 2) 阈值声明：内核 ≥0.80、其余 ≥0.60；内核模块必须显式声明，所有声明（含 profile 覆写）都要达标
          for p, root in sorted(roots.items()):
              aid = artifact_id(root)
              is_kernel = p in kernel
              decls = [text(e) for e in allof(root, "myddd.jacoco.minimum")]
              if is_kernel and not decls:
                  errors.append(f"{p}（{aid}）未声明 <myddd.jacoco.minimum>：门槛会静默继承父级默认值")
                  continue
              for raw in decls:
                  v = as_ratio(str(p), raw)
                  if v is None:
                      continue
                  if is_kernel and v < FLOOR_KERNEL:
                      errors.append(f"{p}（{aid}）的 myddd.jacoco.minimum={raw} 低于 {FLOOR_KERNEL:.2f}（含 profile 覆写在内，全部声明都必须达标）")
                  elif not is_kernel and v < FLOOR_DEFAULT:
                      errors.append(f"{p}（{aid}）的 myddd.jacoco.minimum={raw} 低于 {FLOOR_DEFAULT:.2f}（非内核模块不得自行调低门槛）")

          # 3) 任何 POM 都不得用 <skip>/<haltOnFailure>/全吞 <exclude>/硬编码 <minimum> 绕开门槛
          ALL_MATCHING = {"**", "**/*", "*", "**/*.class", "**/*.*"}
          FORBIDDEN_PROPS = ("jacoco.skip", "jacoco.haltOnFailure", "myddd.jacoco.skip", "myddd.jacoco.haltOnFailure")
          for p, root in sorted(roots.items()):
              for fp in FORBIDDEN_PROPS:
                  if allof(root, fp):
                      errors.append(f"{p} 声明了会关掉门槛的属性 <{fp}>")
              for pl in allof(root, "plugin"):
                  if not any(name(c) == "artifactId" and text(c) == JACOCO for c in pl):
                      continue
                  for ex in allof(pl, "exclude"):
                      if text(ex) in ALL_MATCHING:
                          errors.append(f"{p} 的 JaCoCo <exclude>{text(ex)}</exclude> 会排除全部类（门槛形同虚设）")
                  for sk in allof(pl, "skip"):
                      if text(sk).lower() != "false":
                          errors.append(f"{p} 的 JaCoCo <skip>{text(sk)}</skip> 会跳过门槛（只允许写 false 或删除该元素）")
                  for hn in allof(pl, "haltOnFailure"):
                      if text(hn).lower() != "true":
                          errors.append(f"{p} 的 JaCoCo <haltOnFailure>{text(hn)}</haltOnFailure> 会把门槛失败降级为告警")
                  for inh in allof(pl, "inherited"):
                      if text(inh).lower() == "false":
                          errors.append(f"{p} 的 JaCoCo <inherited>false</inherited> 会让子模块失去门槛")
                  for ph in allof(pl, "phase"):
                      if text(ph).lower() in ("none", ""):
                          errors.append(f"{p} 的 JaCoCo <phase>{text(ph)}</phase> 把门槛执行摘出了构建生命周期")
                  for m in allof(pl, "minimum"):
                      if not text(m).startswith("${"):
                          errors.append(f"{p} 出现硬编码门槛 <minimum>{text(m)}</minimum>：必须引用属性")
                  if p != pathlib.Path("pom.xml") and allof(pl, "rules"):
                      errors.append(f"{p} 覆写了 JaCoCo check 规则（<rules>）：模块只能通过 myddd.jacoco.minimum 属性调阈值，规则结构由父 POM 统一")

          # 4) 父 POM 的 check 执行必须同时约束 LINE 与 BRANCH 的 COVEREDRATIO，且阈值走属性
          root_pom = roots[pathlib.Path("pom.xml")]
          jacoco_plugins = [pl for pl in allof(root_pom, "plugin")
                            if any(name(c) == "artifactId" and text(c) == JACOCO for c in pl)]
          if len(jacoco_plugins) != 1:
              errors.append(f"父 POM 中 JaCoCo 插件声明数 = {len(jacoco_plugins)}（期望 1）")
          else:
              checks = [ex for ex in allof(jacoco_plugins[0], "execution")
                        if any(name(c) == "id" and text(c) == "check" for c in ex)]
              if len(checks) != 1:
                  errors.append(f"父 POM 中 JaCoCo check 执行数 = {len(checks)}（期望 1）")
              else:
                  ce = checks[0]
                  if "check" not in [text(g) for g in allof(ce, "goal")]:
                      errors.append("父 POM 的 check 执行未绑定 check 目标")
                  if [text(e) for e in allof(ce, "element")] != ["BUNDLE"]:
                      errors.append("父 POM 的 check 规则 element 必须是 BUNDLE")
                  limits = {}
                  for lim in allof(ce, "limit"):
                      cs = [text(x) for x in kids(lim, "counter")]
                      vs = [text(x) for x in kids(lim, "value")]
                      ms = [text(x) for x in kids(lim, "minimum")]
                      if len(cs) != 1:
                          errors.append("父 POM 存在无 counter（或 counter 重复）的 limit")
                          continue
                      limits[cs[0]] = (vs[0] if len(vs) == 1 else "", ms[0] if len(ms) == 1 else "")
                  for counter in ("LINE", "BRANCH"):
                      if counter not in limits:
                          errors.append(f"父 POM 的 check 规则缺少 {counter} 门槛（该项被删除即失守）")
                          continue
                      value, minimum = limits[counter]
                      if value != "COVEREDRATIO":
                          errors.append(f"父 POM 的 {counter} 门槛 value={value or '缺失'}（必须是 COVEREDRATIO，否则门槛无效）")
                      if minimum != "${myddd.jacoco.minimum}":
                          errors.append(f"父 POM 的 {counter} 门槛 minimum={minimum or '缺失'}（必须引用 ${{myddd.jacoco.minimum}}）")
                  for counter in limits:
                      if counter not in ("LINE", "BRANCH"):
                          errors.append(f"父 POM 的 check 规则含意外 counter：{counter}")

          if errors:
              for e in errors:
                  print(f"::error::{e}")
              sys.exit(1)
          print(f"覆盖率门槛值守卫通过：内核模块 {len(kernel)} 个阈值均 ≥ {FLOOR_KERNEL:.2f}，父 POM 的 LINE/BRANCH 双门槛均走属性，无硬编码/跳过/全排除")
          PY
      - name: 版本锁步校验（BOM 与父 POM 必须同版本）
        run: |
          set -euo pipefail
          parent_v=$(./mvnw -B -ntp -q -N help:evaluate -Dexpression=project.version -DforceStdout)
          bom_v=$(./mvnw -B -ntp -q -pl myddd-dependencies help:evaluate -Dexpression=project.version -DforceStdout)
          echo "parent=$parent_v bom=$bom_v"
          [ "$parent_v" = "$bom_v" ] || { echo "::error::myddd-dependencies 与 myddd-parent 版本不一致（BOM 中 \${project.version} 指向的模块版本会失准）"; exit 1; }
      - name: BOM 消费端契约回归
        run: |
          set -euo pipefail
          # 依赖已由上方 clean install 装入本地仓库，这里只做消费端解析校验
          ./mvnw -B -ntp -f tools/bom-smoke/pom.xml help:effective-pom -Doutput=target/effective-pom.xml
          check() {
            local artifact="$1" expected="$2"
            local actual
            actual=$(awk '/<\/dependencyManagement>/{f=1} f' tools/bom-smoke/target/effective-pom.xml | grep -A3 "<artifactId>$artifact</artifactId>" | grep -oE '<version>[^<]+</version>' | head -1 | sed -E 's/<\/?version>//g')
            echo "$artifact -> $actual (expect $expected)"
            [ "$actual" = "$expected" ] || { echo "::error::$artifact 版本为 $actual，期望 $expected"; exit 1; }
          }
          check redisson 4.7.0
          check resilience4j-circuitbreaker 2.4.0
          check spring-boot-starter-web 4.1.1
          check myddd-kernel-common 1.0.0-SNAPSHOT
          check myddd-kernel-ddd 1.0.0-SNAPSHOT
          check rocketmq-client 5.5.1
          check archunit 1.5.0
          check myddd-kernel-port 1.0.0-SNAPSHOT
          check myddd-kernel-extension 1.0.0-SNAPSHOT
          check myddd-kernel-statemachine 1.0.0-SNAPSHOT
          check myddd-kernel-rule 1.0.0-SNAPSHOT
          check myddd-domain-starter 1.0.0-SNAPSHOT
          check myddd-archunit 1.0.0-SNAPSHOT
          check myddd-test-starter 1.0.0-SNAPSHOT
          check myddd-persistence-starter 1.0.0-SNAPSHOT
          check myddd-cache-starter 1.0.0-SNAPSHOT
          check myddd-consistency-starter 1.0.0-SNAPSHOT
          check myddd-web-starter 1.0.0-SNAPSHOT
          check myddd-feign-starter 1.0.0-SNAPSHOT
      - name: BOM 消费端坐标可解析性（版本插值正确 ≠ 构件真实存在）
        run: ./mvnw -B -ntp -f tools/bom-smoke/pom.xml dependency:resolve
      - name: 不引 springdoc 的样例应用启动验证（web-starter openapi 那支的类缺席分支）
        # 单元层证明不了这一支：springdoc 在 web-starter 是 optional 依赖，本模块测试类路径上它永远在。
        # 夹具真起一次上下文，三条断言里两条由"springdoc 不在"决定（对照实验：把 springdoc 加回去即 2 红 1 绿）。
        run: ./mvnw -B -ntp -f tools/no-springdoc-smoke/pom.xml test
