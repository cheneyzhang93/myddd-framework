name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建与测试
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and verify
        run: ./mvnw -B -ntp clean install
      - name: 断言覆盖率产物存在（防"无测试数据即跳过门槛"）
        run: |
          set -euo pipefail
          missing=0
          while IFS= read -r pom; do
            grep -q '<packaging>pom</packaging>' "$pom" && continue
            module_dir="$(dirname "$pom")"
            if ! grep -q 'jacoco-maven-plugin' "$pom"; then
              echo "::error::模块 $module_dir 为 jar 打包但未激活 JaCoCo（父 POM 只在 pluginManagement 中声明，模块须在 <build><plugins> 中显式激活），覆盖率门槛会静默失效"
              missing=1
              continue
            fi
            if [ ! -s "$module_dir/target/site/jacoco/jacoco.csv" ]; then
              echo "::error::模块 $module_dir 声明了 JaCoCo 却未产出覆盖率数据（测试缺失或未执行）"
              missing=1
            fi
          done < <(find . -name pom.xml -not -path '*/target/*')
          exit $missing
      - name: 版本锁步校验（BOM 与父 POM 必须同版本）
        run: |
          set -euo pipefail
          parent_v=$(./mvnw -B -ntp -q -N help:evaluate -Dexpression=project.version -DforceStdout)
          bom_v=$(./mvnw -B -ntp -q -pl myddd-dependencies help:evaluate -Dexpression=project.version -DforceStdout)
          echo "parent=$parent_v bom=$bom_v"
          [ "$parent_v" = "$bom_v" ] || { echo "::error::myddd-dependencies 与 myddd-parent 版本不一致（BOM 中 \${project.version} 指向的模块版本会失准）"; exit 1; }
      - name: BOM 消费端契约回归
        run: |
          set -euo pipefail
          # 依赖已由上方 clean install 装入本地仓库，这里只做消费端解析校验
          ./mvnw -B -ntp -f tools/bom-smoke/pom.xml help:effective-pom -Doutput=target/effective-pom.xml
          check() {
            local artifact="$1" expected="$2"
            local actual
            actual=$(awk '/<\/dependencyManagement>/{f=1} f' tools/bom-smoke/target/effective-pom.xml | grep -A3 "<artifactId>$artifact</artifactId>" | grep -oE '<version>[^<]+</version>' | head -1 | sed -E 's/<\/?version>//g')
            echo "$artifact -> $actual (expect $expected)"
            [ "$actual" = "$expected" ] || { echo "::error::$artifact 版本为 $actual，期望 $expected"; exit 1; }
          }
          check redisson 4.7.0
          check resilience4j-circuitbreaker 2.4.0
          check spring-boot-starter-web 4.1.1
          check myddd-kernel-common 1.0.0-SNAPSHOT
          check rocketmq-client 5.5.1
