# Web 适配层内置错误文案（简体中文，框架兜底语言）。
# 占位符用 MessageFormat 形态（{0} {1}），与内核 ErrorCode.defaultMessage() 的 {} 形态是两套渲染器：
# 这个差异正是 Step 1/3 用来区分"答案来自哪一级"的判据。
myddd.error.invalid-parameter=参数校验失败
myddd.error.malformed-request=请求格式错误
myddd.error.argument-invalid=参数 {0} 不合法
myddd.error.unauthorized=未认证或登录已过期
myddd.error.forbidden=无权访问该资源
myddd.error.not-found=资源不存在
myddd.error.method-not-allowed=请求方法不支持
myddd.error.conflict=数据状态冲突，请刷新后重试
myddd.error.illegal-state=当前状态 {0} 不允许执行操作 {1}
myddd.error.lock-acquire-failed=资源正在处理中，请稍后重试
myddd.error.idempotent-conflict=重复请求，请勿重复提交
myddd.error.unsupported-media-type=不支持的请求媒体类型
myddd.error.too-many-requests=请求过于频繁，请稍后重试
myddd.error.system=系统内部错误
myddd.error.service-degraded=服务暂时不可用（熔断降级）
