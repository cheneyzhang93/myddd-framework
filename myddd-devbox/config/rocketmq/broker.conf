brokerClusterName = MydddCluster
brokerName = myddd-broker-0
brokerId = 0
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH
autoCreateTopicEnable = true
# 公告 127.0.0.1 + 关 VIP 通道：devbox 的客户端在宿主机，只经发布端口 10911 连接。
# Linux 上让容器内客户端直连时，把 brokerIP1 改成 rocketmq-broker 并直连 10911。
brokerIP1 = 127.0.0.1
sendMessageWithVIPChannel = false
# 定时消息（deliverAt → TIMER_DELIVER_MS）走时间轮，缺省关闭；不开则 broker 丢弃定时属性。
timerWheelEnable = true
